<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">3D tumor complexity evidence chain</title>
  <desc id="desc">A five-step research workflow from de-identified volume through segmentation, validated geometry, uncertainty, and a preregistered comparison with an AI-only baseline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#071725"/><stop offset="1" stop-color="#103850"/></linearGradient>
  </defs>
  <rect width="1440" height="520" rx="32" fill="url(#bg)"/>
  <text x="72" y="83" fill="#f5fbff" font-family="Arial, sans-serif" font-size="34" font-weight="700">3D tumor-complexity research evidence chain</text>
  <text x="72" y="121" fill="#b7d0df" font-family="Arial, sans-serif" font-size="19">Every link is inspectable; no link alone establishes clinical utility.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 185)"><rect width="220" height="198" rx="18" fill="#13344c" stroke="#58c6e9"/><text x="24" y="43" fill="#78d7f2" font-size="16" font-weight="700">01 · INPUT</text><text x="24" y="83" fill="#fff" font-size="23" font-weight="700">De-identified</text><text x="24" y="112" fill="#fff" font-size="23" font-weight="700">3D volume</text><text x="24" y="153" fill="#c7dae5" font-size="16">DICOM / NIfTI</text><text x="24" y="177" fill="#c7dae5" font-size="16">spacing + orientation</text></g>
    <g transform="translate(338 185)"><rect width="220" height="198" rx="18" fill="#13344c" stroke="#7ce0b8"/><text x="24" y="43" fill="#8ee8c5" font-size="16" font-weight="700">02 · DEFINE</text><text x="24" y="83" fill="#fff" font-size="23" font-weight="700">Tumor and</text><text x="24" y="112" fill="#fff" font-size="23" font-weight="700">subregion masks</text><text x="24" y="153" fill="#c7dae5" font-size="16">expert / AI / imported</text><text x="24" y="177" fill="#c7dae5" font-size="16">with provenance</text></g>
    <g transform="translate(606 185)"><rect width="220" height="198" rx="18" fill="#13344c" stroke="#ffd572"/><text x="24" y="43" fill="#ffe09b" font-size="16" font-weight="700">03 · MEASURE</text><text x="24" y="83" fill="#fff" font-size="23" font-weight="700">Physical-scale</text><text x="24" y="112" fill="#fff" font-size="23" font-weight="700">3D geometry</text><text x="24" y="153" fill="#c7dae5" font-size="16">FD · lacunarity</text><text x="24" y="177" fill="#c7dae5" font-size="16">surface + topology</text></g>
    <g transform="translate(874 185)"><rect width="220" height="198" rx="18" fill="#13344c" stroke="#bd9dfc"/><text x="24" y="43" fill="#d2c0ff" font-size="16" font-weight="700">04 · QUALIFY</text><text x="24" y="83" fill="#fff" font-size="23" font-weight="700">Stability and</text><text x="24" y="112" fill="#fff" font-size="23" font-weight="700">uncertainty</text><text x="24" y="153" fill="#c7dae5" font-size="16">scale window · CI</text><text x="24" y="177" fill="#c7dae5" font-size="16">mask perturbation</text></g>
    <g transform="translate(1142 185)"><rect width="220" height="198" rx="18" fill="#13344c" stroke="#f792a7"/><text x="24" y="43" fill="#ffafbf" font-size="16" font-weight="700">05 · TEST</text><text x="24" y="83" fill="#fff" font-size="23" font-weight="700">Incremental</text><text x="24" y="112" fill="#fff" font-size="23" font-weight="700">value study</text><text x="24" y="153" fill="#c7dae5" font-size="16">AI-only vs combined</text><text x="24" y="177" fill="#c7dae5" font-size="16">external validation</text></g>
    <g fill="#b8d8e8"><path d="M300 281h27l-12-12m12 12-12 12M568 281h27l-12-12m12 12-12 12M836 281h27l-12-12m12 12-12 12M1104 281h27l-12-12m12 12-12 12" stroke="#b8d8e8" stroke-width="4" fill="none"/></g>
  </g>
  <text x="72" y="456" fill="#b7d0df" font-family="Arial, sans-serif" font-size="17">Research principle: preserve the original image, the mask, the method, and the uncertainty with every result.</text>
</svg>
