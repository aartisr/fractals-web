<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc">
  <title id="title">3D fractal metric family</title>
  <desc id="desc">Four complementary metric families for a volumetric tumor: volume fill, surface roughness, gap distribution, and internal signal heterogeneity.</desc>
  <rect width="1440" height="610" rx="32" fill="#f3f8fb"/>
  <text x="72" y="82" fill="#112d42" font-family="Arial, sans-serif" font-size="34" font-weight="700">One volume, four complementary complexity questions</text>
  <text x="72" y="119" fill="#527087" font-family="Arial, sans-serif" font-size="19">A single fractal-dimension number is not a sufficient description of tumor morphology.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 176)"><rect width="300" height="350" rx="18" fill="#fff" stroke="#a7c7d9"/><text x="26" y="47" fill="#075b8f" font-size="17" font-weight="700">VOLUME-FILL FD</text><path d="M70 115h110v110H70zM105 80h110v110H105zM140 45h110v110H140z" fill="none" stroke="#278ab7" stroke-width="5"/><text x="26" y="230" fill="#18384d" font-size="22" font-weight="700">How does the mask occupy</text><text x="26" y="258" fill="#18384d" font-size="22" font-weight="700">3D space across scale?</text><text x="26" y="306" fill="#527087" font-size="16">Cube-count occupied voxels at</text><text x="26" y="330" fill="#527087" font-size="16">physical millimeter scales.</text></g>
    <g transform="translate(402 176)"><rect width="300" height="350" rx="18" fill="#fff" stroke="#a7c7d9"/><text x="26" y="47" fill="#0c8068" font-size="17" font-weight="700">SURFACE FD</text><path d="M54 136c40-95 137-100 191-43 58 61 3 168-77 145-70-20-74-71-114-102z" fill="#bdeee1" stroke="#179e82" stroke-width="7"/><path d="M86 156c20-16 29 16 47 0s29 17 46-3 29 15 44-4" fill="none" stroke="#fff" stroke-width="5"/><text x="26" y="258" fill="#18384d" font-size="22" font-weight="700">How rough is the boundary?</text><text x="26" y="306" fill="#527087" font-size="16">Measure the isosurface, not</text><text x="26" y="330" fill="#527087" font-size="16">only the filled tumor volume.</text></g>
    <g transform="translate(734 176)"><rect width="300" height="350" rx="18" fill="#fff" stroke="#a7c7d9"/><text x="26" y="47" fill="#a06a00" font-size="17" font-weight="700">LACUNARITY + TOPOLOGY</text><circle cx="145" cy="139" r="91" fill="#ffe8a9"/><circle cx="110" cy="113" r="20" fill="#fff"/><circle cx="174" cy="157" r="31" fill="#fff"/><circle cx="175" cy="91" r="11" fill="#fff"/><text x="26" y="258" fill="#18384d" font-size="22" font-weight="700">Where are the gaps, holes,</text><text x="26" y="286" fill="#18384d" font-size="22" font-weight="700">components, and cavities?</text><text x="26" y="330" fill="#527087" font-size="16">FD and lacunarity must be read</text><text x="26" y="354" fill="#527087" font-size="16">together, with topology.</text></g>
    <g transform="translate(1066 176)"><rect width="300" height="350" rx="18" fill="#fff" stroke="#a7c7d9"/><text x="26" y="47" fill="#7339a8" font-size="17" font-weight="700">INTENSITY / MULTIFRACTAL</text><rect x="67" y="72" width="164" height="164" rx="18" fill="#d9c6f3"/><path d="M75 170c32-84 65 42 96-55 24-76 40 75 54-24" fill="none" stroke="#7f48b4" stroke-width="15"/><text x="26" y="258" fill="#18384d" font-size="22" font-weight="700">How does signal vary across</text><text x="26" y="286" fill="#18384d" font-size="22" font-weight="700">space and scale?</text><text x="26" y="330" fill="#527087" font-size="16">Only after locked intensity</text><text x="26" y="354" fill="#527087" font-size="16">normalization and preprocessing.</text></g>
  </g>
</svg>
