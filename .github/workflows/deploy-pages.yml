name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Pin npm
        run: npm install --global npm@9.9.4
      - name: Verify application quality
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
          npm run check:quality
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the public guide
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Submit sitemap URLs to IndexNow
        env:
          INDEXNOW_KEY: f3c0a1d3b2e4f56789ab0cdef1234567
          INDEXNOW_KEY_LOCATION: https://aartisr.github.io/fractals-web/f3c0a1d3b2e4f56789ab0cdef1234567.txt
          INDEXNOW_SITEMAP: pages/sitemap.xml
        run: npm run submit:indexnow
