name: Sync Wiki source

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fractals-web-wiki
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Check that the GitHub Wiki is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }} --jq '.has_wiki' | grep -qx true || {
            echo "Enable Wikis in this repository's Settings, then run this workflow again."
            exit 1
          }
      - name: Clone the Wiki
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
          WIKI_SYNC_USERNAME: ${{ github.repository_owner }}
        run: |
          test -n "$WIKI_SYNC_TOKEN" || {
            echo "Add the WIKI_SYNC_TOKEN repository secret with Contents: Read and write access to this repository, then run this workflow again."
            exit 1
          }
          GH_TOKEN="$WIKI_SYNC_TOKEN" gh api "repos/${{ github.repository }}" --silent || {
            echo "WIKI_SYNC_TOKEN cannot access ${{ github.repository }}. Check that it is active, belongs to a collaborator, and has Contents: Read and write access to this repository."
            exit 1
          }
          git clone "https://${WIKI_SYNC_USERNAME}:${WIKI_SYNC_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-publish || {
            echo "The Wiki Git repository is not initialized yet. Open the repository's Wiki tab, create and save one initial page, then run this workflow again."
            exit 1
          }
      - name: Update managed Wiki pages
        run: |
          cp wiki/*.md wiki-publish/
          cd wiki-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          git diff --cached --quiet || git commit -m "docs: sync Wiki source"
          git push
